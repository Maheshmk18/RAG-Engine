[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag"
version = "1.0.0"
description = "Enterprise RAG: cited question answering over internal documents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.9",
    "pymongo>=4.10,<5",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "fastembed>=0.5,<1",
    "groq>=0.30,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT"]
ignore = ["B008", "SIM905"]

[tool.mypy]
python_version = "3.11"
packages = ["app", "evals"]
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires a MongoDB server"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx`"]
