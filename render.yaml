services:
  - type: web
    name: enterprise-rag-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: off
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_JSON
        value: "true"
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DATABASE
        value: enterprise_rag
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: enterprise-rag-1024
      - key: PINECONE_NAMESPACE
        value: enterprise-rag
      - key: PINECONE_EMBEDDING_MODEL
        value: multilingual-e5-large
      - key: PINECONE_EMBEDDING_DIMENSIONS
        value: "1024"
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EMBEDDED_WORKER
        value: "true"
      - key: WARM_MODELS_ON_STARTUP
        value: "false"
