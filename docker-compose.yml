name: rag-engine

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragengine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragengine"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment: &backend-env
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/ragengine
      CORS_ORIGINS: http://localhost:5173
      MODEL_CACHE_DIR: /srv/models
    ports:
      - "8000:8000"
    volumes:
      - models:/srv/models
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    volumes:
      - models:/srv/models
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  models:
