name: Answer quality

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: answer-quality
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evaluate:
    name: Full evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MODEL_CACHE_DIR: ${{ github.workspace }}/.model-cache
    steps:
      - name: Require an API key
        if: env.GROQ_API_KEY == ''
        working-directory: .
        run: |
          echo "::error::Add a GROQ_API_KEY repository secret to run the answer quality evaluation."
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_CACHE_DIR }}
          key: models-${{ hashFiles('backend/app/core/config.py') }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Evaluate answers
        run: python -m evals.run --suite full --output reports/full.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: answer-quality-report
          path: backend/reports/full.json
